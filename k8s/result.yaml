apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: microservices-demo
  labels:
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: result
        image: result-service # Placeholder for Kustomize
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DATABASE_URL
          value: "postgres://okteto:okteto@postgresql:5432/votes"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: microservices-demo
spec:
  type: LoadBalancer
  selector:
    app: result
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
