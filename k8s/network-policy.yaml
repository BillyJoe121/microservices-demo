apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: microservices-demo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
  namespace: microservices-demo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {} # Allow traffic from other pods in the same namespace
  egress:
  - to:
    - podSelector: {} # Allow traffic to other pods in same namespace
    - ipBlock:
        cidr: 0.0.0.0/0 # Allow egress to external services (Kafka/DB if outside)
