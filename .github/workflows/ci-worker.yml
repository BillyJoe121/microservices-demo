name: CI - Worker Service

on:
  push:
    branches: ["main"]
    paths:
      - 'worker/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'worker/**'

jobs:
  test-and-build:
    name: Test & Build Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: worker/go.sum

      - name: 🧹 Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: worker
          args: --timeout=5m

      - name: 🧪 Run Unit Tests
        working-directory: worker
        run: go test -v ./...

      - name: 🏗️ Build Binary
        working-directory: worker
        run: go build -v ./...

      - name: 🐳 Docker Build, Scan, & Push
        uses: ./.github/actions/docker-build-scan-push
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          image_name: ${{ secrets.DOCKER_USERNAME }}/worker
          context: worker
          github_sha: ${{ github.sha }}
          github_run_number: ${{ github.run_number }}
