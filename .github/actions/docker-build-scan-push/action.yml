name: 'Docker Build, Scan, and Push'
description: 'Builds a Docker image, scans it for vulnerabilities using Trivy, and pushes it if it passes.'

inputs:
  docker_username:
    description: 'Docker Hub Username'
    required: true
  docker_password:
    description: 'Docker Hub Password'
    required: true
  image_name:
    description: 'Target image name (e.g. username/result)'
    required: true
  context:
    description: 'Build context / working directory'
    required: true
  github_sha:
    description: 'GitHub SHA for tagging'
    required: true
  github_run_number:
    description: 'GitHub Run Number for tagging'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker

    - name: 🔑 Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: 🐳 Build and load Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        push: false
        load: true
        tags: ${{ inputs.image_name }}:local-test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🛡️ Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: '${{ inputs.image_name }}:local-test'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: 🚀 Push Docker image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        push: true
        tags: |
          ${{ inputs.image_name }}:latest
          ${{ inputs.image_name }}:${{ inputs.github_sha }}
          ${{ inputs.image_name }}:v1.${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
