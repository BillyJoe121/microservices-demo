name: CI - Result Service

on:
  push:
    branches: ["main"]
    paths:
      - 'result/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'result/**'

jobs:
  test-and-build:
    name: Test & Build Result
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: result/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: result
        run: npm ci

      - name: 🧹 Run Linter
        working-directory: result
        run: npm run lint

      - name: 🧪 Run Unit Tests
        working-directory: result
        run: npm test

      - name: 🐳 Docker Build, Scan, & Push
        uses: ./.github/actions/docker-build-scan-push
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          image_name: ${{ secrets.DOCKER_USERNAME }}/result
          context: result
          github_sha: ${{ github.sha }}
          github_run_number: ${{ github.run_number }}
