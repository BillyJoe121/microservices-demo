apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: microservices-demo
  labels:
    app: vote
spec:
  replicas: 2 # Scalability demonstration
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: ${DOCKER_USERNAME}/vote:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: vote
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
