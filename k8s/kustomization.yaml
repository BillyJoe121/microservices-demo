apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace to deploy all resources
namespace: microservices-demo

# List of resources to include
resources:
  - namespace.yaml
  - vote.yaml
  - result.yaml
  - worker.yaml

# Common labels to apply to all resources and selectors
commonLabels:
  project: microservices-demo
  managed-by: kustomize
