# Default values for infrastructure.
postgresql:
  enabled: true
  auth:
    database: votes
    username: okteto
    password: okteto

kafka:
  enabled: true
  replicaCount: 1
  image:
    repository: bitnami/kafka
    tag: 3.4.0
    pullPolicy: IfNotPresent
  service:
    port: 9092
  config:
    nodeId: "0"
    processRoles: "broker,controller"
    controllerQuorumVoters: "0@kafka:9093"
    listeners: "PLAINTEXT://:9092,CONTROLLER://:9093"
    advertisedListeners: "PLAINTEXT://kafka:9092"
    controllerListenerNames: "CONTROLLER"
    listenerSecurityProtocolMap: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  zookeeper:
    enabled: true
  persistence:
    enabled: true
    size: 1Gi
  externalZookeeper:
    enabled: false
