name: Infrastructure Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'k8s/**'
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - 'okteto.yml'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'k8s/**'
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - 'okteto.yml'
      - '.github/workflows/infrastructure.yml'

jobs:
  validate-yaml:
    name: 📄 Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml

  validate-docker:
    name: 🐳 Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          # Configuration is automatically picked up from .hadolint.yaml
          recursive: true
          failure-threshold: error

  validate-compose:
    name: 🏗️ Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Validate Compose File
        run: docker compose config -q

  validate-helm:
    name: ☸️ Lint & Package Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: 🔍 Find and Lint All Charts
        run: |
          find . -name "Chart.yaml" -exec dirname {} \; | while read chart_dir; do
            echo "Linting chart in $chart_dir"
            helm lint "$chart_dir"
          done

      - name: 📦 Package Infrastructure Chart
        run: |
          mkdir -p dist
          helm package infrastructure/ --destination dist/

      - name: 🗳️ Upload Helm Package
        uses: actions/upload-artifact@v4
        with:
          name: helm-infrastructure-package
          path: dist/*.tgz

  security-scan:
    name: 🛡️ IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🕵️ Run Checkov Static Analysis
        uses: bridgecrewio/checkov-action@v12.3023.0
        with:
          directory: .
          framework: kubernetes,helm,dockerfile
          quiet: true
          soft_fail: true
          output_format: cli,sarif
          output_directory: checkov_reports
          # Explicitly target infra directories to differentiate from app code
          check: CKV_K8S_1,CKV_K8S_2,CKV_DOCKER_1,CKV_DOCKER_2 

      - name: 🗳️ Upload Checkov Results
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov_reports
