icon: https://github.com/okteto/microservices-demo/raw/main/vote-icon.png

build:
  result:
    context: result
    dockerfile: Dockerfile

  vote:
    context: vote
    dockerfile: Dockerfile

  worker:
    context: worker
    dockerfile: Dockerfile

  dev:
    context: worker
    dockerfile: Dockerfile
    target: dev

deploy:
  - helm upgrade --install infrastructure infrastructure/
  - cd k8s && kustomize edit set image vote-service=${OKTETO_BUILD_VOTE_IMAGE}
  - cd k8s && kustomize edit set image result-service=${OKTETO_BUILD_RESULT_IMAGE}
  - cd k8s && kustomize edit set image worker-service=${OKTETO_BUILD_WORKER_IMAGE}
  - kubectl apply -k k8s

forward:
  - 5432:postgresql:5432

dev:
  vote:
    command: mvn spring-boot:run
    sync:
      - ./vote:/app
    forward:
      - 5005:5005
    persistentVolume:
      enabled: false

  result:
    command: nodemon server.js
    sync:
      - ./result:/app
    persistentVolume:
      enabled: false

  worker:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: bash
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    sync:
      - ./worker:/app
    forward:
      - 2345:2345
    persistentVolume:
      enabled: false
